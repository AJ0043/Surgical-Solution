{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Surgical Solutions</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon and Stylesheets -->
  <link rel="icon" href="{% static 'Images/1212.png' %}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>
</head>

<body>

  <!-- ✅ Preloader -->
  <div id="preloader">
    <div class="download-container">
      <img src="{% static 'Images/1212.png' %}" alt="Logo" class="preloader-logo flip">
      <div class="loader"></div>
    </div>
  </div>

  <!-- ✅ Navbar -->
  {% include 'Store/Inc/navbar.html' %}

  <!-- ✅ Page Content -->
  {% block content %}{% endblock %}

  <!-- ✅ Appointment Modal -->
  {% if request.path == '/' %}
    <div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-md custom-slide-modal">
        <div class="modal-content modal-styled shadow-lg">
          <div class="modal-header" id="modalHeader">
            <h5 class="modal-title fw-bold" id="appointmentModalLabel">
              <i class="fas fa-calendar-check me-2"></i> Book Appointment
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center px-4 py-4" id="modalBody">
            <img src="{% static 'Images/1212.png' %}" alt="Logo" class="img-fluid mb-3" style="max-width: 150px;">
            <p class="lead mb-4">Welcome to <span class="fw-bold text-primary">Surgical Solutions</span>!<br>Ready to consult with <strong>Dr. Shialendra Jain</strong>?</p>
            <form method="POST" action="">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-6 mb-3"><input type="text" name="name" class="form-control" placeholder="Full Name" required></div>
                <div class="col-md-6 mb-3"><input type="tel" name="phone" class="form-control" placeholder="Phone Number" required></div>
                <div class="col-md-6 mb-3"><input type="number" name="age" class="form-control" placeholder="Age" required></div>
                <div class="col-md-6 mb-3"><input type="text" name="city" class="form-control" placeholder="City" required></div>
                <div class="col-md-12 mb-3"><textarea name="message" class="form-control" placeholder="Any message or symptoms" rows="3"></textarea></div>
                <div class="col-md-12 mb-3"><input type="text" name="surgery" class="form-control" placeholder="Surgery Type (optional)"></div>
              </div>
              <button type="submit" class="btn glowing-btn px-4 py-2 rounded-pill"><i class="fas fa-pencil-alt me-2"></i> Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  {% endif %}

  <!-- ✅ Color Customizer Toggle Button -->
  <button id="openColorBoxBtn" class="btn btn-primary rounded-circle" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
    <i class="fas fa-palette"></i>
  </button>

  <!-- ✅ Color Customizer Box -->
  <div id="colorCustomizer" class="color-box" style="display: none; position: fixed; bottom: 70px; right: 20px; background: white; border: 2px solid #ccc; padding: 8px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); z-index: 9999;">
    <div class="color-option" data-color="#007bff" style="background-color: #007bff;"></div>
    <div class="color-option" data-color="#28a745" style="background-color: #28a745;"></div>
    <div class="color-option" data-color="#17a2b8" style="background-color: #17a2b8;"></div>
    <div class="color-option" data-color="#ffc107" style="background-color: #ffc107;"></div>
    <div class="color-option" data-color="#6f42c1" style="background-color: #6f42c1;"></div>
    <div class="color-option" data-color="#4179c1" style="background-color:rgb(66, 115, 193);"></div>
    <div class="color-option" data-color="#69aeba" style="background-color:rgb(105, 154, 171);"></div>
    <!-- Added New Color Options -->
    <div class="color-option" data-color="#f44336" style="background-color: #f44336;"></div> <!-- Red -->
    <div class="color-option" data-color="#ff9800" style="background-color: #ff9800;"></div> <!-- Orange -->
  </div>

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Autocomplete search
    $.ajax({
      method: "GET",
      url: "/product-list/",
      success: function (response) {
        $("#SearchProduct").autocomplete({ source: response });
      },
      error: function (xhr, status, error) {
        console.error("Error fetching product list:", error);
      }
    });

    alertify.set('notifier', 'position', 'top-right');
    {% for msg in messages %}
      alertify.success('{{ msg }}');
    {% endfor %}

    // Preloader + Modal
    window.addEventListener('load', function () {
      const preloader = document.getElementById('preloader');
      setTimeout(() => {
        preloader.style.opacity = '0';
        setTimeout(() => {
          preloader.style.display = 'none';
          setTimeout(() => {
            const appointmentModal = new bootstrap.Modal(document.getElementById('appointmentModal'));
            appointmentModal.show();
          }, 2000);
        }, 600);
      }, 1000);
    });

    // Color Customizer Script
    const colorOptions = document.querySelectorAll('.color-option');
    const colorCustomizerBox = document.getElementById('colorCustomizer');
    const openColorBoxBtn = document.getElementById('openColorBoxBtn');
    const modalHeader = document.getElementById('modalHeader');
    const modalBody = document.getElementById('modalBody');
    const footer = document.querySelector('footer');

    // Toggle color box visibility
    openColorBoxBtn.addEventListener('click', () => {
      colorCustomizerBox.style.display = (colorCustomizerBox.style.display === 'none' || colorCustomizerBox.style.display === '') ? 'block' : 'none';
    });

    // Change colors
    colorOptions.forEach(option => {
      option.addEventListener('click', () => {
        const color = option.getAttribute('data-color');
        
        // Change navbar, modal, footer and other elements colors
        document.querySelectorAll('.navbar, .top-navbar').forEach(el => el.style.backgroundColor = color);
        modalHeader.style.backgroundColor = color;
        modalBody.style.backgroundColor = `rgba(${parseInt(color.substring(1, 3), 16)}, ${parseInt(color.substring(3, 5), 16)}, ${parseInt(color.substring(5, 7), 16)}, 0.1)`;
        footer.style.backgroundColor = color;

        document.querySelectorAll('.card, .box, .service-card').forEach(el => {
          el.style.borderColor = color;
          el.style.boxShadow = `0 0 15px ${color}55`;
        });

        document.querySelectorAll('.topic-banner, .section-heading, .hero-text').forEach(el => el.style.color = color);
        localStorage.setItem('themeColor', color);
      });
    });

    // Load color from localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedColor = localStorage.getItem('themeColor');
      if (savedColor) {
        document.querySelectorAll(`.color-option[data-color="${savedColor}"]`).forEach(opt => opt.click());
      }
    });
  </script>

  <!-- ✅ Custom Styles -->
  <style>
    body {
      min-height: 100vh;
      background-color: rgba(255, 255, 255, 0.6);
      overflow-x: hidden;
    }

    .ajs-message.ajs-success {
      background-color: rgb(8, 8, 63);
      color: white;
      font-size: 20px;
      font-family: 'Times New Roman', Times, serif;
      border-radius: 20px;
      padding: 5px;
      font-weight: bold;
      width: 250px;
      margin-top: -2050px;
      margin-left: 1700px;
    }

    .modal-header {
      background: linear-gradient(90deg, rgb(51, 146, 56), #87CEFA);
    }

    .modal-body {
      background-color: rgba(61, 55, 148, 0.5);
    }

    .glowing-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
      transition: 0.3s ease;
    }

    .glowing-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.7);
      background: linear-gradient(45deg, #0072ff, #00c6ff);
    }

    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: white;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .download-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .preloader-logo {
      width: 500px;
      animation: flipAnimation 2s infinite;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes flipAnimation {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    .modal-styled {
      border-radius: 1.5rem;
      animation: slideInUp 0.6s ease;
    }

    @keyframes slideInUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ✅ Color Customizer Box */
    #colorCustomizer.color-box {
      position: fixed;
      bottom: 70px;
      right: 20px;
      background: white;
      border: 2px solid #ccc;
      padding: 8px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      z-index: 9999;
    }

    #colorCustomizer .color-option {
      width: 30px;
      height: 30px;
      margin: 5px;
      cursor: pointer;
      border-radius: 50%;
    }
  </style>
</body>
</html>
