{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>Surgical Solutions</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" style="max-width:200px;" href="{% static 'Images/1212.png' %}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css" />
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>

</head>

<body>

  <!-- ✅ Preloader with Image and Flip Animation -->
  <div id="preloader">
    <div class="download-container">
      <img src="{% static 'Images/1212.png' %}" alt="Logo" class="preloader-logo flip">
      <div class="loader"></div>
    </div>
  </div>

  <!-- ✅ Navbar Include -->
  {% include 'Store/Inc/navbar.html' %}

  <!-- ✅ Page Content -->
  {% block content %}
  {% endblock %}

  <!-- ✅ Book Appointment Popup Modal (Home Page Only) -->
  {% if request.path == '/' %}
    <div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-md custom-slide-modal">
        <div class="modal-content modal-styled shadow-lg">
          <div class="modal-header bg-gradient text-white">
            <h5 class="modal-title fw-bold" id="appointmentModalLabel">
              <i class="fas fa-calendar-check me-2"></i> Book Appointment
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center px-4 py-4">
            <!-- Surgical Solutions Logo -->
            <img src="{% static 'Images/1212.png' %}" alt="Surgical Solutions Logo" class="img-fluid mb-3" style="max-width: 150px;">
            <p class="lead mb-4">Welcome to <span class="fw-bold text-primary">Surgical Solutions</span>!<br>
              Ready to consult with <strong>Dr. Shialendra Jain</strong>?</p>

            <form method="POST" action="">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-6 mb-3">
                  <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-6 mb-3">
                  <input type="tel" name="phone" class="form-control" placeholder="Phone Number" required>
                </div>
                <div class="col-md-6 mb-3">
                  <input type="number" name="age" class="form-control" placeholder="Age" required>
                </div>
                <div class="col-md-6 mb-3">
                  <input type="text" name="city" class="form-control" placeholder="City" required>
                </div>
                <div class="col-md-12 mb-3">
                  <textarea name="message" class="form-control" placeholder="Any message or symptoms" rows="3"></textarea>
                </div>
                <div class="col-md-12 mb-3">
                  <input type="text" name="surgery" class="form-control" placeholder="Surgery Type (optional)">
                </div>
              </div>

              <button type="submit" class="btn glowing-btn px-4 py-2 rounded-pill">
                <i class="fas fa-pencil-alt me-2"></i> Book Now
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  {% endif %}

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

  <script>
    var availableTags = [];
    $.ajax({
      method: "GET",
      url: "/product-list/",
      success: function(response) {
        availableTags = response;
        $("#SearchProduct").autocomplete({ source: availableTags });
      },
      error: function(xhr, status, error) {
        console.error("An error occurred while fetching the product list:", error);
      }
    });

    alertify.set('notifier', 'position', 'top-right');
    {% for msg in messages %}
      alertify.success('{{ msg }}');
    {% endfor %}

    // ✅ Show Preloader, then Show Modal after 2 seconds
    window.addEventListener('load', function () {
      const preloader = document.getElementById('preloader');
      setTimeout(() => {
        preloader.style.opacity = '0';
        setTimeout(() => {
          preloader.style.display = 'none';
          setTimeout(() => {
            const appointmentModal = new bootstrap.Modal(document.getElementById('appointmentModal'));
            appointmentModal.show();
          }, 2000);
        }, 600);
      }, 1000);
    });
  </script>

  <!-- ✅ Custom Styles -->
  <style>
    body {
      min-height: 100vh;
      width: 100vw;
      background-color:rgba(255, 255, 255, 0.6);
      overflow-x: hidden;
    }

    html {
      scroll-behavior: smooth;
    }

    .ajs-message.ajs-success {
      border-radius: 20px;
      background-color: rgb(8, 8, 63);
      color: white;
      padding: 5px;
      margin-top: -2050px;
      font-size: 20px;
      font-family: 'Times New Roman', Times, serif;
      width: 250px;
      margin-left: 1700px;
      font-weight: bold;
    }

    /* Update Modal Styling */
    .modal-header.bg-gradient {
      background: linear-gradient(90deg, #ADD8E6, #87CEFA); /* Light Blue Gradient */
    }

    .modal-body {
      background-color:rgba(55, 94, 148, 0.6); /* Light Cyan for the body */
    }

    /* Optional: Adjust button color for better contrast */
    .glowing-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
      transition: 0.3s ease;
    }

    .glowing-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.7);
      color: #fff;
      background: linear-gradient(45deg, #0072ff, #00c6ff);
    }

    /* ✅ Preloader Styles */
    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: white;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .download-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .preloader-logo {
      width: 500px;
      height: auto;
      margin-bottom: 20px;
      transform-origin: center center;
      animation: flipAnimation 2s infinite;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes flipAnimation {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    /* ✅ Modal Styling */
    @keyframes slideInUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-styled {
      border-radius: 1.5rem;
      animation: slideInUp 0.6s ease;
      border: none;
    }

    .bg-gradient {
      background: linear-gradient(90deg, #0062E6, #33AEFF);
    }

    .glowing-btn {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
      transition: 0.3s ease;
    }

    .glowing-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.7);
      color: #fff;
      background: linear-gradient(45deg, #0072ff, #00c6ff);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .preloader-logo {
        width: 200px;
      }

      .loader {
        width: 40px;
        height: 40px;
      }

      #preloader {
        flex-direction: column;
      }

      .modal-body {
        padding: 20px;
      }

      .form-control {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .preloader-logo {
        width: 150px;
      }

      .loader {
        width: 35px;
        height: 35px;
      }

      #preloader {
        padding: 20px;
      }

      .modal-body {
        padding: 15px;
      }
    }
  </style>

</body>
</html>
