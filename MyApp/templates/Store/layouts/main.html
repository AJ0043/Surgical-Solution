{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Surgical Solutions</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" style="max-width:200px;" href="{% static 'Images/1212.png' %}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.js"></script>
</head>

<body>

  <!-- ✅ Preloader with Image and Flip Animation -->
  <div id="preloader">
    <div class="download-container">
      <!-- Preloader Image with Flip Animation -->
      <img src="{% static 'Images/1212.png' %}" alt="Logo" class="preloader-logo flip">
      
      <!-- Loader Animation -->
      <div class="loader"></div>
    </div>
  </div>

  <!-- ✅ Navbar Include -->
  {% include 'Store/Inc/navbar.html' %}

  <!-- ✅ Page Content -->
  {% block content %}
  {% endblock %}

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

  <script>
    var availableTags = [];
    $.ajax({
      method: "GET",
      url: "/product-list/",
      success: function(response) {
        availableTags = response;
        $("#SearchProduct").autocomplete({ source: availableTags });
      },
      error: function(xhr, status, error) {
        console.error("An error occurred while fetching the product list:", error);
      }
    });

    alertify.set('notifier', 'position', 'top-right');
    {% for msg in messages %}
      alertify.success('{{ msg }}');
    {% endfor %}

    // ✅ Show Preloader for 1 second
    window.addEventListener('load', function () {
      const preloader = document.getElementById('preloader');
      setTimeout(() => {
        preloader.style.opacity = '0';
        setTimeout(() => {
          preloader.style.display = 'none';
        }, 600);
      }, 1000); // 1 second delay
    });
  </script>

  <!-- ✅ Custom Styles -->
  <style>
    body {
      min-height: 100vh;
      width: 100vw;
      background-color: white;
      overflow-x: hidden;
    }

    html {
      scroll-behavior: smooth;
    }

    .ajs-message.ajs-success {
      border-radius: 20px;
      background-color: rgb(8, 8, 63);
      color: white;
      padding: 5px;
      margin-top: -2050px;
      font-size: 20px;
      font-family: 'Times New Roman', Times, serif;
      width: 250px;
      margin-left: 1700px;
      font-weight: bold;
    }

    /* ✅ Preloader Styles */
    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: white;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .download-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .preloader-logo {
      width: 500px; /* Adjust the logo size */
      height: auto;
      margin-bottom: 20px;
      transform-origin: center center;
      animation: flipAnimation 2s infinite;
    }

    .loader {
      border: 4px solid #f3f3f3; /* Light gray */
      border-top: 4px solid #3498db; /* Blue */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Flip Animation */
    @keyframes flipAnimation {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    /* ✅ Media Queries for Responsiveness */
    @media (max-width: 768px) {
      .preloader-logo {
        width: 200px; /* Adjust logo size for smaller screens */
      }

      .loader {
        width: 40px;
        height: 40px;
      }

      #preloader {
        flex-direction: column; /* Stack items vertically */
      }
    }

    @media (max-width: 480px) {
      .preloader-logo {
        width: 150px; /* Adjust logo size for very small screens */
      }

      .loader {
        width: 35px;
        height: 35px;
      }

      #preloader {
        padding: 20px; /* Add padding for very small screens */
      }
    }
  </style>

</body>
</html>
